<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a senha</title>
    <link rel="stylesheet" href="./css/esqueciasenha.css">
</head>
<body>

    <div class="container">
        <h1>Nova senha</h1>

        <p>Crie uma nova senha para sua conta.</p>

        <form>
            <div class="form-control">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Digite seu email" required>
            </div>

            <div class="form-control">
                <label for="senha">Nova senha:</label>
                <input type="password" id="senha" placeholder="Crie uma nova senha" required>
            </div>

            <div class="form-control">
                <label for="confirmar">Confirmar nova senha:</label>
                <input type="password" id="confirmar" placeholder="Digite a senha novamente" required>
            </div>

            <div class="form-control">
                <button type="submit">Salvar nova senha</button>
            </div>
        </form>

        <a href="login.html">Voltar para o login</a>

        <br><br>

        <a href="index.html">Voltar para o cadastro</a>
    </div>

</body>
</html>
